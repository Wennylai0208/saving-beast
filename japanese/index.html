<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>夜聲日文｜歌曲主題學日語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c22; --bg2:#12154a; --card:#171a44; --card2:#1e2258; --card3:#242a6b;
  --line:rgba(255,255,255,.10);
  --text:#f1f2ff; --dim:#a3a8dc; --dim2:#7d82b8;
  --p1:#ff5fa8; --p2:#8a5cff; --p3:#38e8ff; --p4:#ffd166; --good:#3ddc97; --bad:#ff5d6c;
  --radius:20px; --radius-sm:12px;
  --ff-jp:'Zen Maru Gothic','Klee One','Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
  --ff-zh:'Zen Maru Gothic','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{
  font-family:var(--ff-zh);
  min-height:100vh;
  background:
    radial-gradient(ellipse 120% 60% at 15% -10%, rgba(138,92,255,.35), transparent 60%),
    radial-gradient(ellipse 100% 50% at 90% 0%, rgba(255,95,168,.28), transparent 55%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(56,232,255,.16), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 80% 15%, #fff, transparent),
    radial-gradient(1px 1px at 60% 40%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 30% 65%, #fff, transparent),
    radial-gradient(1px 1px at 90% 70%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 45% 85%, #fff, transparent),
    radial-gradient(1px 1px at 15% 90%, #fff, transparent);
  background-size:100% 100%;
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:86px;}
a{color:var(--p3);}
ruby{ruby-position:over;}
rt{font-size:.55em;color:var(--dim);font-weight:400;}
button{font-family:inherit;}
.hide{display:none !important;}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;backdrop-filter:blur(10px);background:rgba(10,12,34,.72);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--ff-jp);font-weight:900;font-size:18px;letter-spacing:.02em;}
.brand .note{font-size:16px;}
.topstats{display:flex;gap:10px;font-size:12px;color:var(--dim);}
.topstats span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
.topstats b{color:var(--p4);}

.view{padding:16px;animation:fadein .35s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){ .view{animation:none;} }

.h1{font-family:var(--ff-jp);font-weight:900;font-size:22px;margin:4px 0 4px;}
.h2{font-family:var(--ff-jp);font-weight:700;font-size:17px;margin:22px 0 10px;color:#fff;}
.sub{color:var(--dim);font-size:13.5px;line-height:1.6;margin:0 0 14px;}
.small{font-size:12px;color:var(--dim2);}

.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.card.tight{padding:12px 14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rowflex{display:flex;align-items:center;justify-content:space-between;gap:10px;}

.pill{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:700;letter-spacing:.02em;}
.pill.n5{background:rgba(61,220,151,.18);color:var(--good);}
.pill.n4{background:rgba(56,232,255,.18);color:var(--p3);}
.pill.n3{background:rgba(255,95,168,.18);color:var(--p1);}
.pill.kana{background:rgba(255,209,102,.18);color:var(--p4);}
.pill.locked{background:rgba(255,255,255,.08);color:var(--dim2);}

.btn{border:none;border-radius:999px;padding:13px 20px;font-weight:800;font-size:15px;cursor:pointer;
  color:#0a0c22;background:linear-gradient(135deg,var(--p3),var(--p2));transition:transform .12s ease, filter .12s ease;}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;}
.btn.ghost{background:var(--card3);color:var(--text);border:1px solid var(--line);}
.btn.block{display:block;width:100%;text-align:center;}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4);}
.btn.sm{padding:8px 14px;font-size:13px;}

.speakbtn{border:1px solid var(--line);background:var(--card3);color:var(--p3);border-radius:999px;
  width:34px;height:34px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.speakbtn:active{transform:scale(.9);}

.unitrow{display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;background:var(--card2);
  border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:transform .12s;}
.unitrow:active{transform:scale(.98);}
.unitrow.locked{opacity:.5;cursor:default;}
.unitnum{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-family:var(--ff-jp);background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;flex:none;font-size:15px;}
.unitnum.done{background:linear-gradient(135deg,var(--good),#22b57a);}
.unitnum.lock{background:var(--card3);color:var(--dim2);}
.unitinfo{flex:1;min-width:0;}
.unitinfo .t{font-weight:800;font-family:var(--ff-jp);font-size:15px;}
.unitinfo .s{font-size:12px;color:var(--dim);}
.score{font-size:12px;font-weight:800;color:var(--p4);}

/* bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:rgba(10,12,34,.85);backdrop-filter:blur(14px);border-top:1px solid var(--line);}
.navwrap{max-width:560px;width:100%;display:flex;}
.navbtn{flex:1;background:none;border:none;color:var(--dim2);padding:9px 4px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11px;cursor:pointer;}
.navbtn .ic{font-size:20px;}
.navbtn.active{color:var(--p3);}

/* vocab */
.vocabtable{width:100%;border-collapse:collapse;}
.vocabtable td{padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
.vocabtable td.jp{font-family:var(--ff-jp);font-size:16px;font-weight:700;}
.vocabtable td.pos{color:var(--dim2);font-size:11px;white-space:nowrap;}
.vocabtable tr:last-child td{border-bottom:none;}

.gcard{border-left:3px solid var(--p3);padding-left:12px;margin-bottom:16px;}
.gcard .pattern{font-family:var(--ff-jp);font-weight:800;font-size:15.5px;color:var(--p3);margin-bottom:4px;}
.gcard .zh{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:8px;}
.exline{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;background:var(--card3);border-radius:12px;padding:10px 12px;}
.exline .jp{font-family:var(--ff-jp);font-size:15px;line-height:1.9;}
.exline .ex-zh{font-size:12.5px;color:var(--dim);margin-top:3px;}

.copyline{font-size:11px;color:var(--dim2);text-align:center;margin:16px 0 4px;line-height:1.7;}
.ytlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;
  background:rgba(255,0,0,.18);border:1px solid rgba(255,80,80,.4);padding:8px 14px;border-radius:999px;text-decoration:none;}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.hearts{font-size:16px;letter-spacing:2px;}
.progress-bar{height:8px;background:var(--card3);border-radius:999px;overflow:hidden;margin-bottom:16px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:999px;transition:width .3s ease;}
.qtype-tag{font-size:11px;color:var(--p4);font-weight:800;letter-spacing:.03em;margin-bottom:8px;}
.qtext{font-family:var(--ff-jp);font-size:18px;line-height:1.8;margin-bottom:18px;font-weight:600;}
.choice{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:15.5px;font-family:var(--ff-jp);color:var(--text);cursor:pointer;
  transition:transform .1s ease, background .15s ease, border-color .15s ease;}
.choice:active{transform:scale(.98);}
.choice.correct{background:rgba(61,220,151,.22);border-color:var(--good);}
.choice.wrong{background:rgba(255,93,108,.22);border-color:var(--bad);}
.choice[disabled]{cursor:default;}
.shakeme{animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@media (prefers-reduced-motion: reduce){ .shakeme{animation:none;} .choice{transition:none;} }
.popfeed{margin-top:10px;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.7;}
.popfeed.ok{background:rgba(61,220,151,.14);border:1px solid rgba(61,220,151,.4);}
.popfeed.no{background:rgba(255,93,108,.14);border:1px solid rgba(255,93,108,.4);}
.orderwrap{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px;font-family:var(--ff-jp);font-size:17px;line-height:2.4;}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:60px;height:38px;border-bottom:2px solid var(--dim2);
  padding:0 4px;color:var(--dim);}
.slot.star{color:var(--p1);font-weight:900;border-color:var(--p1);}
.slot.filled{color:var(--text);border-color:var(--p3);}
.blockbtn{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;
  font-family:var(--ff-jp);color:var(--text);cursor:pointer;}
.blockbtn:active{transform:scale(.96);}
.blockbtn.correct{background:rgba(61,220,151,.22);border-color:var(--good);}
.blockbtn.wrong{background:rgba(255,93,108,.22);border-color:var(--bad);}
.blockbtn[disabled]{cursor:default;}

.resultwrap{text-align:center;padding:20px 0;}
.resultwrap .big{font-size:48px;font-weight:900;font-family:var(--ff-jp);background:linear-gradient(135deg,var(--p1),var(--p3));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.resultwrap .lbl{color:var(--dim);font-size:14px;margin-top:4px;}

.timerbig{font-family:var(--ff-jp);font-size:15px;font-weight:800;color:var(--p4);background:var(--card3);
  border-radius:999px;padding:5px 14px;}
.combo{font-size:12px;color:var(--p1);font-weight:800;}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.4);}

.kanagrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
.kanacell{aspect-ratio:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:var(--ff-jp);}
.kanacell .k{font-size:19px;font-weight:700;}
.kanacell .r{font-size:9.5px;color:var(--dim2);margin-top:2px;}
.kanacell:active{transform:scale(.92);background:var(--card3);}
.kanacell.empty{visibility:hidden;}

.segtab{display:flex;background:var(--card3);border-radius:999px;padding:4px;margin-bottom:14px;}
.segtab button{flex:1;border:none;background:none;color:var(--dim);padding:9px 0;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer;}
.segtab button.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;}

.xpbar{background:var(--card3);border-radius:999px;height:12px;overflow:hidden;}
.xpbar .f{height:100%;background:linear-gradient(90deg,var(--p4),var(--p1));}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.statbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
.statbox .n{font-size:22px;font-weight:900;font-family:var(--ff-jp);color:var(--p4);}
.statbox .l{font-size:11px;color:var(--dim);margin-top:2px;}

.toggle{position:relative;width:46px;height:26px;background:var(--card3);border-radius:999px;border:1px solid var(--line);cursor:pointer;flex:none;}
.toggle .dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--dim2);transition:transform .2s ease, background .2s ease;}
.toggle.on{background:rgba(61,220,151,.25);}
.toggle.on .dot{transform:translateX(20px);background:var(--good);}

.emptybox{text-align:center;padding:40px 16px;color:var(--dim2);}
.emptybox .ic{font-size:40px;margin-bottom:10px;}

.mistakerow{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.mistakerow .q{font-family:var(--ff-jp);font-size:14.5px;margin-bottom:4px;}
.mistakerow .meta{font-size:11px;color:var(--dim2);}
</style>
</head>
<body>
<div id="app"><!-- 備用說明：瀏覽器正常執行時會被 render() 清掉；在 Telegram 預覽等不跑程式的地方才看得到 -->
  <div style="padding:48px 24px;text-align:center;color:#f1f2ff;font-size:17px;line-height:1.8;">
    <div style="font-size:44px;">🌙</div>
    <div style="font-size:22px;font-weight:700;margin:8px 0 16px;">夜聲日文</div>
    <p style="margin:0 0 16px;">這裡沒辦法顯示 app 畫面，<br>請直接打開下面這個<b style="color:#ffd166;">網址</b>：</p>
    <p style="margin:0 0 16px;word-break:break-all;"><a href="https://wennylai0208.github.io/saving-beast/japanese/" style="color:#38e8ff;">https://wennylai0208.github.io/saving-beast/japanese/</a></p>
    <p style="margin:0;color:#a3a8dc;font-size:15px;">💻 電腦也可以把檔案下載後直接點兩下</p>
  </div>
</div>
<div id="toastHost"></div>
<script>
'use strict';

/* ===================== 小工具 ===================== */
function rb(s){ // 把「漢字(かな)」轉成 <ruby>
  if(!s) return '';
  return s.replace(/([一-龥々]+)\(([^)]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
}
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function toKata(s){ return s.replace(/[ぁ-ゖ]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60)); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function reduceMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function ytSearch(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('這個瀏覽器不支援語音朗讀，建議用 Chrome 或 Safari 開'); return; }
    window.speechSynthesis.cancel();
    const plain = text.replace(/<[^>]+>/g,'').replace(/[\(（][^)）]*[\)）]/g,'');
    const u = new SpeechSynthesisUtterance(plain);
    u.lang='ja-JP'; u.rate=0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ toast('語音播放失敗'); }
}
function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2200);
}

/* ===================== 本地儲存 / 狀態 ===================== */
const STORE_KEY='jpsong_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function defaultState(){
  return { xp:0, streak:0, lastActive:'', unitScores:{}, kanaDone:{}, mistakes:[], settings:{unlockAll:false} };
}
let STATE = loadState();
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){ /* 存不了就算了，不擋使用者 */ }
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchStreak(){
  const t = todayStr();
  if(STATE.lastActive === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  STATE.streak = (STATE.lastActive === yStr) ? (STATE.streak+1) : 1;
  STATE.lastActive = t;
  saveState();
}
function addXP(n){ STATE.xp += n; saveState(); }

/* ===================== 五十音資料 ===================== */
const hiraSeion=[
 {r:'あ行',c:[['あ','a'],['い','i'],['う','u'],['え','e'],['お','o']]},
 {r:'か行',c:[['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko']]},
 {r:'さ行',c:[['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so']]},
 {r:'た行',c:[['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to']]},
 {r:'な行',c:[['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no']]},
 {r:'は行',c:[['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho']]},
 {r:'ま行',c:[['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo']]},
 {r:'や行',c:[['や','ya'],['ゆ','yu'],['よ','yo']]},
 {r:'ら行',c:[['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro']]},
 {r:'わ行',c:[['わ','wa'],['を','wo'],['ん','n']]},
];
const hiraDaku=[
 {r:'が行',c:[['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go']]},
 {r:'ざ行',c:[['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo']]},
 {r:'だ行',c:[['だ','da'],['ぢ','ji'],['づ','zu'],['で','de'],['ど','do']]},
 {r:'ば行',c:[['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo']]},
 {r:'ぱ行',c:[['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po']]},
];
const hiraYoon=[
 {r:'きゃ行',c:[['きゃ','kya'],['きゅ','kyu'],['きょ','kyo']]},
 {r:'しゃ行',c:[['しゃ','sha'],['しゅ','shu'],['しょ','sho']]},
 {r:'ちゃ行',c:[['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho']]},
 {r:'にゃ行',c:[['にゃ','nya'],['にゅ','nyu'],['にょ','nyo']]},
 {r:'ひゃ行',c:[['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo']]},
 {r:'みゃ行',c:[['みゃ','mya'],['みゅ','myu'],['みょ','myo']]},
 {r:'りゃ行',c:[['りゃ','rya'],['りゅ','ryu'],['りょ','ryo']]},
 {r:'ぎゃ行',c:[['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo']]},
 {r:'じゃ行',c:[['じゃ','ja'],['じゅ','ju'],['じょ','jo']]},
 {r:'びゃ行',c:[['びゃ','bya'],['びゅ','byu'],['びょ','byo']]},
 {r:'ぴゃ行',c:[['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo']]},
];
function toKataRows(rows){ return rows.map(row=>({ r: toKata(row.r), c: row.c.map(([k,r])=>[toKata(k), r]) })); }
const kataSeion = toKataRows(hiraSeion), kataDaku = toKataRows(hiraDaku), kataYoon = toKataRows(hiraYoon);

const KANA_LESSONS=[
 {id:'k1', title:'第1課：あ〜た行', rowsHira:hiraSeion.slice(0,4), rowsKata:kataSeion.slice(0,4)},
 {id:'k2', title:'第2課：な〜わ行、ん', rowsHira:hiraSeion.slice(4), rowsKata:kataSeion.slice(4)},
 {id:'k3', title:'第3課：濁音・半濁音', rowsHira:hiraDaku, rowsKata:kataDaku},
 {id:'k4', title:'第4課：拗音（きゃ行等）', rowsHira:hiraYoon, rowsKata:kataYoon},
];
function allKanaPairs(hira){
  const pool=[];
  hira.forEach(row=> row.c.forEach(([k,r])=> pool.push([k,r])));

const LEVELS = ['N5','N4','N3'];
function unitsOf(level){ return UNITS.filter(u=>u.level===level); }

/* ===================== 解鎖 / 分數 ===================== */
function unitOrder(){ return UNITS.map(u=>u.id); }
function isUnlocked(id){
  if(STATE.settings.unlockAll) return true;
  const order = unitOrder();
  const idx = order.indexOf(id);
  if(idx<=0) return true;
  const prev = order[idx-1];
  return (STATE.unitScores[prev]||0) >= 70;
}
function bestScore(id){ return STATE.unitScores[id]||0; }
function setScore(id, pct){
  if(!STATE.unitScores[id] || pct > STATE.unitScores[id]) STATE.unitScores[id]=pct;
  saveState();
}

/* ===================== 路由 / 畫面狀態 ===================== */
let ROUTE = {tab:'home', view:null, params:{}};
function go(view, params){ ROUTE.view=view; ROUTE.params=params||{}; render(); window.scrollTo(0,0); }
function setTab(tab){ ROUTE.tab=tab; ROUTE.view=null; render(); window.scrollTo(0,0); }

/* ===================== 主渲染 ===================== */
function render(){
  touchStreak();
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(topbarEl());
  const viewHost = document.createElement('div');
  viewHost.className='view';
  viewHost.appendChild(renderView());
  app.appendChild(viewHost);
  app.appendChild(navbarEl());
}
function topbarEl(){
  const d = document.createElement('div'); d.className='topbar';
  d.innerHTML = '<div class="brand"><span class="note">🌙</span>夜聲日文</div>'+
    '<div class="topstats"><span>🔥連續 <b>'+STATE.streak+'</b> 天</span><span>⭐ <b>'+STATE.xp+'</b> XP</span></div>';
  return d;
}
function navbarEl(){
  const wrap=document.createElement('div'); wrap.className='navbar';
  const inner=document.createElement('div'); inner.className='navwrap';
  const items=[['home','🏠','首頁'],['lessons','📚','課程'],['quiz','📝','測驗'],['mistakes','📕','錯題本'],['me','🙍','我的']];
  items.forEach(([id,ic,label])=>{
    const b=document.createElement('button'); b.className='navbtn'+(ROUTE.tab===id?' active':'');
    b.innerHTML='<span class="ic">'+ic+'</span><span>'+label+'</span>';
    b.onclick=()=>setTab(id);
    inner.appendChild(b);
  });
  wrap.appendChild(inner);
  return wrap;
}
function renderView(){
  const host=document.createElement('div');
  if(ROUTE.view==='unit'){ host.appendChild(unitView(ROUTE.params.id)); return host; }
  if(ROUTE.view==='quizrun'){ host.appendChild(quizRunView(ROUTE.params)); return host; }
  if(ROUTE.view==='kanaLesson'){ host.appendChild(kanaLessonView(ROUTE.params.id)); return host; }
  if(ROUTE.view==='kanaQuiz'){ host.appendChild(kanaQuizView(ROUTE.params)); return host; }
  if(ROUTE.view==='mockPick'){ host.appendChild(mockPickView(ROUTE.params.level)); return host; }
  switch(ROUTE.tab){
    case 'home': host.appendChild(homeView()); break;
    case 'lessons': host.appendChild(lessonsView()); break;
    case 'quiz': host.appendChild(quizHubView()); break;
    case 'mistakes': host.appendChild(mistakesView()); break;
    case 'me': host.appendChild(meView()); break;
    default: host.appendChild(homeView());
  }
  return host;
}

      '<div class="unitinfo"><div class="t">'+esc(u.song)+'</div><div class="s">'+(sc>0?('最高 '+sc+'%'):'尚未挑戰')+'</div></div>';
    if(unlocked) row.onclick=()=>go('quizrun',{mode:'unit', unitId:u.id});
    d.appendChild(row);
  });
  return d;
}
function mockPickView(level){
  const d=document.createElement('div');
  const back=mkBtn('← 回測驗','ghost sm',()=>setTab('quiz')); back.style.marginBottom='12px'; d.appendChild(back);
  d.insertAdjacentHTML('beforeend', '<div class="h1">'+level+' 模擬測驗</div><p class="sub">綜合文字語彙、文法、読解、聴解，共約 '+mockSize(level)+' 題。分數僅供練習估算合格與否，不代表正式成績。</p>');
  const startBtn=mkBtn('開始模擬測驗','btn primary block',()=>go('quizrun',{mode:'mock', level}));
  d.appendChild(startBtn);
  return d;
}
function mockSize(level){
  const u = unitsOf(level).reduce((s,x)=>s+x.quiz.length,0);
  return u + READINGS[level].reduce((s,r)=>s+r.qs.length,0) + LISTENINGS[level].length;
}

/* ===================== 五十音課程 / 測驗 ===================== */
function kanaLessonView(id){
  const kl = KANA_LESSONS.find(k=>k.id===id);
  const d=document.createElement('div');
  const back=mkBtn('← 回課程列表','ghost sm',()=>setTab('lessons')); back.style.marginBottom='12px'; d.appendChild(back);
  d.insertAdjacentHTML('beforeend', '<div class="h1">'+kl.title+'</div><p class="sub">點格子可以聽發音。學完可以直接做這課的小測驗。</p>');

  const state = {mode:'hira'};
  const segwrap=document.createElement('div'); segwrap.className='segtab';
  const hb=document.createElement('button'); hb.textContent='平假名'; hb.className='on';
  const kb=document.createElement('button'); kb.textContent='片假名';
  segwrap.appendChild(hb); segwrap.appendChild(kb);
  d.appendChild(segwrap);

  const gridHost=document.createElement('div');
  function drawGrid(){
    gridHost.innerHTML='';
    const rows = state.mode==='hira' ? kl.rowsHira : kl.rowsKata;
    rows.forEach(row=>{
      const label=document.createElement('div'); label.className='small'; label.style.margin='10px 0 4px'; label.textContent=row.r;
      gridHost.appendChild(label);
      const grid=document.createElement('div'); grid.className='kanagrid';
      const maxLen = 5;
      row.c.forEach(([k,r])=>{
        const cell=document.createElement('div'); cell.className='kanacell';
        cell.innerHTML='<div class="k">'+k+'</div><div class="r">'+r+'</div>';
        cell.onclick=()=>speak(k);
        grid.appendChild(cell);
      });
      for(let i=row.c.length;i<maxLen;i++){ const e=document.createElement('div'); e.className='kanacell empty'; grid.appendChild(e); }
      gridHost.appendChild(grid);
    });
  }
  hb.onclick=()=>{ state.mode='hira'; hb.className='on'; kb.className=''; drawGrid(); };
  kb.onclick=()=>{ state.mode='kata'; kb.className='on'; hb.className=''; drawGrid(); };
  drawGrid();
  d.appendChild(gridHost);

  const quizBtn=mkBtn('📝 開始這課的小測驗','btn primary block',()=>go('kanaQuiz',{id:kl.id}));
  quizBtn.style.marginTop='16px';
  d.appendChild(quizBtn);
  const confuseBtn=mkBtn('😵 易混字特訓（ぬ/め、シ/ツ、ソ/ン）','btn ghost block',()=>go('kanaQuiz',{id:'confuse'}));
  confuseBtn.style.marginTop='10px';
  d.appendChild(confuseBtn);
  return d;
}
function kanaPoolFor(id){
  if(id==='confuse') return null;
  const kl = KANA_LESSONS.find(k=>k.id===id);
  return { hira: allKanaPairs(kl.rowsHira), kata: allKanaPairs(kl.rowsKata) };
}
function buildKanaQuestions(id){
  if(id==='confuse'){
    const qs=[];
    CONFUSE_PAIRS.forEach(([target,romaji])=>{
      const wrongPool = CONFUSE_PAIRS.filter(p=>p[0]!==target);
      const wrongs = pick(wrongPool,3).map(p=>p[0]);
      qs.push({type:'mc', qtype:'易混字', q:'哪一個唸作「'+romaji+'」？', choices:shuffleWithAnswer(target, wrongs), a:-1, kanaTarget:target});
    });
    return finalizeMc(qs);
  }
  const pool = kanaPoolFor(id);
  const all = pool.hira.concat(pool.kata);
  const qs=[];
  pick(all, Math.min(6, all.length)).forEach(([k,r])=>{
    const wrongs = pick(all.filter(p=>p[1]!==r), 3).map(p=>p[1]);
    qs.push({type:'mc', qtype:'假名→羅馬拼音', q:'「'+k+'」的羅馬拼音是？', choices:shuffleWithAnswer(r, wrongs), a:-1, kanaTarget:r});
  });
  pick(all, Math.min(4, all.length)).forEach(([k,r])=>{
    const wrongs = pick(all.filter(p=>p[0]!==k), 3).map(p=>p[0]);
    qs.push({type:'mc', qtype:'羅馬拼音→假名', q:'「'+r+'」寫成假名是？', choices:shuffleWithAnswer(k, wrongs), a:-1, kanaTarget:k});
  });
  pick(all, Math.min(3, all.length)).forEach(([k,r])=>{
    const wrongs = pick(all.filter(p=>p[0]!==k), 3).map(p=>p[0]);
    qs.push({type:'listen', qtype:'聽音選字', tts:k, q:'請聽發音，選出正確的假名', choices:shuffleWithAnswer(k, wrongs), a:-1, kanaTarget:k});
  });
  if(pool.hira.length && pool.kata.length){
    pick(pool.hira, Math.min(3, pool.hira.length)).forEach(([k,r])=>{
      const kataMatch = pool.kata.find(p=>p[1]===r);
      if(kataMatch){
        const wrongs = pick(pool.kata.filter(p=>p[1]!==r), 3).map(p=>p[0]);
        qs.push({type:'mc', qtype:'平片假名配對', q:'「'+k+'」對應的片假名是？', choices:shuffleWithAnswer(kataMatch[0], wrongs), a:-1, kanaTarget:kataMatch[0]});
      }
    });
  }
  return finalizeMc(shuffle(qs));
}
function shuffleWithAnswer(correct, wrongs){ return shuffle([correct, ...wrongs]); }
function finalizeMc(qs){ qs.forEach(q=>{ q.a = q.choices.indexOf(q.kanaTarget); }); return qs; }

function kanaQuizView(params){
  const questions = buildKanaQuestions(params.id);
  const session = { qs: questions, idx:0, hearts:5, correct:0, combo:0, wrong:[] };
  return runGenericQuiz(session, {
    onFinish(s){
      const pct = Math.round(s.correct/s.qs.length*100);
      addXP(s.correct*2);
      if(params.id!=='confuse'){ STATE.kanaDone[params.id]=true; saveState(); }
      return finishScreen(pct, s, ()=>go('kanaLesson', {id: params.id==='confuse'?'k1':params.id}), '五十音測驗');
    },
    title: params.id==='confuse' ? '易混字特訓' : (KANA_LESSONS.find(k=>k.id===params.id)||{}).title || '假名測驗'
  });
}

/* ===================== 一般測驗（單元／模擬／錯題／限時） ===================== */
function collectQuestions(mode, params){
  if(mode==='unit'){
    const u = UNITS.find(x=>x.id===params.unitId);
    return { title: u.song+'　小考', qs: u.quiz.map(q=>tagQ(q,u)), afterUnit:u.id };
  }
  if(mode==='mock'){
    const level=params.level;
    let qs=[];
    unitsOf(level).forEach(u=> u.quiz.forEach(q=> qs.push(tagQ(q,u))) );
    READINGS[level].forEach(r=>{
      r.qs.forEach(q=> qs.push({type:'reading', passage:r.passage, qtype:'読解', q:q.q, choices:q.choices, a:q.a, exp:q.exp, unitLabel:level+' 模擬測驗'}));
    });
    LISTENINGS[level].forEach(l=> qs.push({type:'listen', qtype:'聴解', tts:l.tts, q:l.q, choices:l.choices, a:l.a, exp:l.exp, unitLabel:level+' 模擬測驗'}));
    return { title: level+' 模擬測驗', qs, isMock:true, level };
  }
  if(mode==='mistakes'){
    return { title:'錯題重考', qs: STATE.mistakes.map(m=>m.q), isRetry:true };
  }
  if(mode==='timed'){
    let pool=[];
    UNITS.forEach(u=>{ if(isUnlocked(u.id)) u.quiz.filter(q=>q.type==='mc').forEach(q=>pool.push(tagQ(q,u))); });
    return { title:'60 秒限時挑戰', qs: shuffle(pool), isTimed:true };
  }
  return {title:'', qs:[]};
}
function tagQ(q,u){ return Object.assign({}, q, {unitLabel:u.song, unitId:u.id}); }

function quizRunView(params){
  const bundle = collectQuestions(params.mode, params);
  if(bundle.qs.length===0){
    const d=document.createElement('div');
    const e=document.createElement('div'); e.className='emptybox'; e.innerHTML='<div class="ic">🤔</div><div>目前沒有題目</div>';
    d.appendChild(e); return d;
  }
  const session = { qs: shuffle(bundle.qs).slice(0, params.mode==='timed'?1000:bundle.qs.length), idx:0, hearts:5, correct:0, combo:0, wrong:[], timed: params.mode==='timed', mock:bundle.isMock, level:bundle.level, retry:bundle.isRetry, afterUnit:bundle.afterUnit };
  return runGenericQuiz(session, {
    title: bundle.title,
    onFinish(s){
      const pct = Math.round(s.correct/s.idx*100) || 0;
      const xpEarn = s.correct * (s.mock?15:(s.retry?8:10));
      addXP(xpEarn);
      if(s.afterUnit) setScore(s.afterUnit, Math.round(s.correct/s.qs.length*100));
      return finishScreen(pct, s, ()=>{ if(s.afterUnit) go('unit',{id:s.afterUnit}); else setTab('quiz'); }, bundle.title, s.mock);
    }
  });
}
function startTimedChallenge(){
  go('quizrun', {mode:'timed'});
}

function runGenericQuiz(session, opts){
  const host=document.createElement('div');
  const back=mkBtn('← 離開測驗','ghost sm',()=>setTab('quiz')); back.style.marginBottom='10px';
  host.appendChild(back);
  if(opts.title){ const t=document.createElement('div'); t.className='h1'; t.textContent=opts.title; host.appendChild(t); }

  const body=document.createElement('div');
  host.appendChild(body);

  let timerId=null, timeLeft=60;
  function paintHead(){
    const head=document.createElement('div'); head.className='qhead';
    const heartsStr = '❤️'.repeat(session.hearts) + '🖤'.repeat(Math.max(0,5-session.hearts));
    head.innerHTML='<div class="hearts">'+heartsStr+'</div>'+
      (session.timed ? '<div class="timerbig">⏱ '+timeLeft+'s</div>' : '<div class="combo">🔥 連擊 '+session.combo+'</div>');
    const pb=document.createElement('div'); pb.className='progress-bar';
    const pct = session.timed ? 0 : Math.round((session.idx/session.qs.length)*100);
    pb.innerHTML='<div class="progress-fill" style="width:'+pct+'%"></div>';
    const wrap=document.createElement('div');
    wrap.appendChild(head); wrap.appendChild(pb);
    return wrap;
  }

  function endSession(){
    if(timerId) clearInterval(timerId);
    body.innerHTML='';
    body.appendChild(opts.onFinish(session));
  }

  function next(){
    session.idx++;
    if(session.timed){
      if(timeLeft<=0){ endSession(); return; }
    } else if(session.hearts<=0 || session.idx>=session.qs.length){
      endSession(); return;
    } else if(session.idx>=session.qs.length){
      endSession(); return;
    }
    paintQuestion();
  }

  function registerAnswer(ok, q){
    if(ok){
      session.correct++; session.combo++;
      if(!session.timed && !session.retry){
        // 若是重考答對，從錯題本移除
      }
      if(session.retry){
        STATE.mistakes = STATE.mistakes.filter(m=> m.q!==q);
        saveState();
      }
    } else {
      session.combo=0;
      if(!session.timed) session.hearts--;
      const already = STATE.mistakes.find(m=>m.q===q);
      if(!already){
        STATE.mistakes.unshift({q:q, unitLabel:q.unitLabel||'', ts:Date.now()});
        if(STATE.mistakes.length>200) STATE.mistakes.pop();
        saveState();
      }
    }
  }

  function paintQuestion(){
    body.innerHTML='';
    if(session.timed && session.idx>=session.qs.length){ endSession(); return; }
    if(!session.timed && session.idx>=session.qs.length){ endSession(); return; }
    const q = session.qs[session.idx];
    body.appendChild(paintHead());
    const qbox=document.createElement('div');
    if(q.qtype) { const tag=document.createElement('div'); tag.className='qtype-tag'; tag.textContent='【'+q.qtype+'】'; qbox.appendChild(tag); }

    if(q.type==='reading'){
      const pcard=document.createElement('div'); pcard.className='card tight';
      pcard.innerHTML='<div style="font-family:var(--ff-jp);font-size:15px;line-height:2;white-space:pre-line">'+rb(esc(q.passage))+'</div>';
      qbox.appendChild(pcard);
    }
    if(q.type==='listen'){
      const lcard=document.createElement('div'); lcard.className='card tight'; lcard.style.textAlign='center';
      const pb=document.createElement('button'); pb.className='btn primary'; pb.innerHTML='🔊 播放發音';
      pb.onclick=()=>speak(q.tts);
      lcard.appendChild(pb);
      qbox.appendChild(lcard);
    }

    if(q.type==='order'){
      const qt=document.createElement('div'); qt.className='qtext'; qt.innerHTML='請選出★位置應該放的詞';
      qbox.appendChild(qt);
      const ow=document.createElement('div'); ow.className='orderwrap';
      const pre=document.createElement('span'); pre.innerHTML=rb(esc(q.prefix)); ow.appendChild(pre);
      q.blocks.forEach((b,i)=>{
        const slot=document.createElement('span'); slot.className='slot'+(i===q.star?' star':'');
        slot.textContent = i===q.star ? '★' : ('＿'+(i+1)+'＿');
        ow.appendChild(slot);
      });
      const suf=document.createElement('span'); suf.textContent=q.suffix; ow.appendChild(suf);
      qbox.appendChild(ow);
      const choicesWrap=document.createElement('div');
      choicesWrap.style.display='flex'; choicesWrap.style.flexWrap='wrap'; choicesWrap.style.gap='10px'; choicesWrap.style.marginTop='6px';
      const shuffled = shuffle(q.blocks.map((b,i)=>({b,i})));
      let answered=false;
      shuffled.forEach(item=>{
        const cb=document.createElement('button'); cb.className='blockbtn'; cb.innerHTML=rb(esc(item.b));
        cb.onclick=()=>{
          if(answered) return; answered=true;
          const ok = item.i===q.star;
          Array.from(choicesWrap.children).forEach(c=>c.disabled=true);
          if(ok){ cb.classList.add('correct'); } else {
            cb.classList.add('wrong'); if(!reduceMotion()) cb.classList.add('shakeme');
            const correctBtn = Array.from(choicesWrap.children)[shuffled.findIndex(x=>x.i===q.star)];
            if(correctBtn) correctBtn.classList.add('correct');
          }
          registerAnswer(ok, q);
          showFeedback(ok, q.exp, q.trans);
        };
        choicesWrap.appendChild(cb);
      });
      qbox.appendChild(choicesWrap);
    } else {
      const qt=document.createElement('div'); qt.className='qtext'; qt.innerHTML=rb(esc(q.q));
      qbox.appendChild(qt);
      const choicesWrap=document.createElement('div');
      let answered=false;
      q.choices.forEach((c,ci)=>{
        const cb=document.createElement('button'); cb.className='choice'; cb.innerHTML=rb(esc(c));
        cb.onclick=()=>{
          if(answered) return; answered=true;
          const ok = ci===q.a;
          Array.from(choicesWrap.children).forEach(x=>x.disabled=true);
          if(ok){ cb.classList.add('correct'); } else {
            cb.classList.add('wrong'); if(!reduceMotion()) cb.classList.add('shakeme');
            choicesWrap.children[q.a].classList.add('correct');
          }
          registerAnswer(ok, q);
          showFeedback(ok, q.exp);
        };
        choicesWrap.appendChild(cb);
      });
      qbox.appendChild(choicesWrap);
    }
    body.appendChild(qbox);

    function showFeedback(ok, exp, trans){
      const fb=document.createElement('div'); fb.className='popfeed '+(ok?'ok':'no');
      fb.innerHTML='<b>'+(ok?'✅ 答對了！':'❌ 答錯了')+'</b><br>'+esc(exp||'')+(trans?('<br>句意：'+esc(trans)):'');
      qbox.appendChild(fb);
      const nb=document.createElement('button'); nb.className='btn block'; nb.style.marginTop='14px';
      nb.textContent = (session.idx+1>=session.qs.length || session.hearts<=0) ? '看結果' : '下一題';
      nb.onclick=()=> next();
      qbox.appendChild(nb);
    }
  }

  if(session.timed){
    timerId=setInterval(()=>{
      timeLeft--;
      if(timeLeft<=0){ endSession(); return; }
      const headEl = body.querySelector('.timerbig');
      if(headEl) headEl.textContent='⏱ '+timeLeft+'s';
    },1000);
  }

  paintQuestion();
  return host;
}

function finishScreen(pct, session, onDone, title, isMock){
  const d=document.createElement('div');
  const r=document.createElement('div'); r.className='resultwrap';
  r.innerHTML='<div class="big">'+pct+'%</div><div class="lbl">答對 '+session.correct+' / '+session.idx+' 題</div>';
  d.appendChild(r);
  if(isMock){
    const passCard=document.createElement('div'); passCard.className='card';
    const passed = pct>=60;
    passCard.innerHTML='<div style="text-align:center;font-weight:900;font-size:17px;color:'+(passed?'var(--good)':'var(--bad)')+'">'+
      (passed?'🎉 估計：合格範圍':'💪 估計：尚未達標')+'</div>'+
      '<div class="small" style="text-align:center;margin-top:6px">這是練習用的粗估（正確率 ≥60% 視為估計合格），不是官方成績，正式合格標準以日檢主辦單位公告為準。</div>';
    d.appendChild(passCard);
  }
  if(!session.timed && session.hearts<=0){
    const wcard=document.createElement('div'); wcard.className='card tight';
    wcard.innerHTML='<div style="text-align:center">💔 愛心用完了，這次先到這裡。答錯的題目已經收進錯題本囉。</div>';
    d.appendChild(wcard);
  }
  const xpline=document.createElement('div'); xpline.className='small'; xpline.style.textAlign='center'; xpline.style.margin='10px 0 18px';
  xpline.textContent='本次獲得 XP + '+ (session.correct * (session.mock?15:(session.retry?8:(session.timed?5:10))));
  d.appendChild(xpline);
  const btn=mkBtn('完成','btn primary block',()=>{ render_after: onDone(); });
  d.appendChild(btn);
  if(!reduceMotion() && pct>=70){
    setTimeout(()=>toast('太棒了，繼續保持！🎉'), 200);
  }
  return d;
}

/* ===================== 啟動 ===================== */
render();
